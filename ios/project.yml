name: GoW2
options:
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Generated/Gow2.xcconfig
  Release: Generated/Gow2.xcconfig
targets:
  GoW2:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated/gow2.env
        buildPhase: resources
    # xcodegen's `type: folder` sources resolve `path` relative to the spec
    # file and hardcode sourceTree=SOURCE_ROOT regardless of --project's
    # output dir (verified empirically: an absolute path is silently turned
    # back into a spec-relative one). Since the project is generated into
    # $B/xcode (not next to project.yml), that folder ref would point at
    # $B/xcode/Generated/licenses, which doesn't exist ("couldn't be opened
    # because there is no such file"). Copy the licenses folder into the
    # bundle with a build script instead, using $(GOW2_IOS_HERE) (an actual
    # absolute Xcode build setting, resolved at build time, not by xcodegen).
    preBuildScripts:
      - name: Copy FFmpeg licenses
        shell: /bin/bash
        script: |
          set -euo pipefail
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/licenses"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$GOW2_IOS_HERE/Generated/licenses/." "$DEST/"
        basedOnDependencyAnalysis: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: God of War II
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GOW2_IOS_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(GOW2_IOS_TEAM)
        CODE_SIGN_STYLE: Automatic
        # Absolute (via the xcconfig): the project is generated into $B/xcode,
        # and these two settings are taken literally, relative to the project.
        CODE_SIGN_ENTITLEMENTS: $(GOW2_IOS_HERE)/GoW2.entitlements
        INFOPLIST_FILE: $(GOW2_IOS_HERE)/Generated/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_OPTIMIZATION_LEVEL: "2"
        DEAD_CODE_STRIPPING: NO
        GCC_C_LANGUAGE_STANDARD: c11
        OTHER_CFLAGS: "-mcpu=apple-a15"
        HEADER_SEARCH_PATHS: "$(GOW2_IOS_HEADER_PATHS)"
        OTHER_LDFLAGS: "$(GOW2_IOS_LDFLAGS)"
